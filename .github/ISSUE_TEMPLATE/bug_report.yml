name: Bug report
description: Report a reproducible problem without private source or credentials.
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, use GitHub's private reporting feature when available. Never paste tokens, private repositories, raw enterprise reports, or personal information."
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal public or synthetic reproduction
      description: Include a redacted command, version, OS and artifact types. Use a public commit or fictional fixture.
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Relevant coverage diagnostics
      description: Review and redact paths, identifiers and metadata before sharing.
